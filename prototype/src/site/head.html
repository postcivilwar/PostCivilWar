<style>
/* The same ground the game has always been tested on (the document the build wraps the local copy in), black
   before anything is drawn, and no pulling the page down to reload it in the middle of a game. */
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{background:#000;overscroll-behavior:none}
body{margin:0;font:14px system-ui,sans-serif;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script>
/* A browser's offer to put the game on the device comes when the browser chooses, often before the game's own
   script has been read. It is kept here for the game to use (src/client/webapp.js), and so is the news that
   it has been done. The browser's own way of offering is left alone. */
window.addEventListener('beforeinstallprompt', function (e) { window.__PCW_INSTALL = e; });
window.addEventListener('appinstalled', function () { window.__PCW_INSTALL = null; window.__PCW_INSTALLED = true; });
</script>
