<title>PostCivilWar Vehicle Yard</title>
<style>
  :root { color-scheme: dark; --bg: #0d0d0e; --fg: #f4f4f2; --dim: #9c9ca1; --line: #2c2c2e; --accent: #ffffff; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #bar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; background: linear-gradient(#0d0d0eee, #0d0d0e00); align-items: center; }
  #bar h1 { font-size: 15px; margin: 0 10px 0 0; letter-spacing: 0.06em; text-transform: uppercase; }
  #bar button { background: #1c1c1e; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
  #bar .gap { width: 10px; }
  #names { position: fixed; inset: 0; pointer-events: none; }
  #names div { position: absolute; transform: translate(-50%, 0); text-align: center; font-size: 12px; color: var(--fg); background: #0d0d0ecc; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
  #names small { display: block; color: var(--dim); font-size: 11px; }
  #info { position: fixed; left: 16px; right: 16px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--dim); font-size: 12px; }
</style>
<canvas id="view"></canvas>
<div id="names"></div>
<div id="bar"><h1>PostCivilWar · Vehicle yard</h1><span id="sets"></span><span class="gap"></span><span id="levels"></span><span class="gap"></span><span id="switches"></span></div>
<div id="info"></div>
